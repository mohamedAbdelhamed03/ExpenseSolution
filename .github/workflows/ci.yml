name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ExpenseSolution.slnx
      - name: Build
        run: dotnet build ExpenseSolution.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test ExpenseSolution.slnx --configuration Release --no-build --no-restore
